# EigenCapital Market Schedules
# Every instrument declares an authoritative trading schedule.
# All components (signal, risk, execution, reconciliation, watchdog)
# consume this schedule rather than making implicit weekday/weekend assumptions.

# ═══════════════════════════════════════════════════════════════════
# Forex — WEEKDAY, 24h sessions, Mon-Fri
# ═══════════════════════════════════════════════════════════════════

[instruments.EURUSD]
session_type = "WEEKDAY"
timezone = "UTC"
trading_days_per_year = 252
bars_per_trading_day = 24
asset_class = "forex"
description = "EUR/USD major FX pair"

[instruments.EURUSD.sessions]
open = "00:00"
close = "00:00"  # 24h

