[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigencapital"
version = "0.1.0"
description = "Asset-agnostic quantitative research and execution platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "EigenCapital Team"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.15",
    "mypy>=2.0",
]
research = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "property: property-based tests",
]

[tool.coverage.run]
source = ["eigencapital"]
omit = [
    "tests/*",
    "**/research/alpha/**",
    "**/research/intraday/**",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = [
    "UP006", "UP035", "UP042",
    "B007", "B027", "B904", "B905",
    "SIM102", "SIM103", "SIM105", "SIM108", "SIM114", "SIM115", "SIM201",
    "RUF001", "RUF002", "RUF003", "RUF005", "RUF007", "RUF012", "RUF013",
    "RUF015", "RUF017", "RUF022", "RUF034", "RUF046", "RUF059",
    "E501",
]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
