# ═══════════════════════════════════════════════════════════════════
# Crypto — CONTINUOUS_24_7, with maintenance windows
# ═══════════════════════════════════════════════════════════════════

[instruments.BTCUSD]
session_type = "CONTINUOUS_24_7"
timezone = "UTC"
trading_days_per_year = 365
bars_per_trading_day = 288
asset_class = "crypto"
description = "Bitcoin vs USD — 24/7 trading"

[[instruments.BTCUSD.maintenance]]
day = 5  # Saturday
start = "04:00"
end = "04:30"
description = "Saturday maintenance window"
