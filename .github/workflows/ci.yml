name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Repo hygiene — no tracked files may be gitignored
        run: |
          offenders="$(git ls-files -i -c --exclude-standard)"
          if [ -n "$offenders" ]; then
            echo "::error::Tracked files match .gitignore — untrack them (git rm --cached) or fix the rule:"
            echo "$offenders"
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/eigencapital/ scripts/

      - name: Type check critical packages with mypy
        run: |
          # EC-AUD-010: Gate mypy on critical safety packages (fail on errors)
          mypy src/eigencapital/live/ src/eigencapital/reconciliation/ src/eigencapital/production_qual/ \
            --ignore-missing-imports --no-error-summary
          # Full codebase check (informational only, does not fail CI)
          mypy src/eigencapital/ --ignore-missing-imports || true

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=eigencapital \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      # Suites outside tests/unit/ (all verified green in-tree, no live
      # services required). Gated to one interpreter to keep matrix runtime
      # bounded — unit tests above still run on every Python version.
      - name: Run property / integration / dashboard suites
        if: matrix.python-version == '3.13'
        run: |
          pytest tests/property tests/integration tests/failure_injection \
            tests/simulation src/eigencapital/dashboard/tests -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint (oxlint)
        working-directory: dashboard
        run: npm run lint

      # `npm run build` = `tsc -b && vite build` (typecheck + bundle)
      - name: Typecheck and build
        working-directory: dashboard
        run: npm run build
