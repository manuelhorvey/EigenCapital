[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eigencapital"
version = "0.5.0"
description = "Asset-agnostic quantitative research and execution platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "EigenCapital Team"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.15.0,<0.16",
    "mypy>=2.0",
    # Dashboard stack is also required to run the test suite (tests import
    # eigencapital.dashboard). See the `dashboard` extra for the canonical list.
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
dashboard = [
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
research = [
    "yfinance>=0.2.0",
]
mt5 = [
    "mt5linux>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = [
    # Research campaigns/executors are research-only tooling (A4): they ship
    # with the repo for reproducibility but must not install into production
    # deployments. Shared primitives they need (CostModel, provenance hashing)
    # live in eigencapital.core and are re-exported for compatibility.
    "eigencapital.research*",
    "eigencapital.dashboard.tests*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "property: property-based tests",
]

[tool.coverage.run]
source = ["eigencapital"]
omit = [
    "tests/*",
    # Research no longer ships in the installed package (A4, see
    # [tool.setuptools] exclude) and is exercised by its own dedicated suite
    # under tests/unit/research. Fidelity/micro_live/paper are part of the
    # promotion path and ARE measured (T5).
    "**/research/**",
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.mypy]
python_version = "3.11"
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = true
files = ["src/eigencapital"]

# Third-party deps without published type stubs. Importing them is fine; mypy
# treats them as Any rather than erroring on every import site.
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "mt5linux.*",
    "yfinance.*",
    "MetaTrader5",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
ignore = [
    "UP006", "UP035", "UP042",
    "B007", "B027", "B904", "B905",
    "SIM102", "SIM103", "SIM105", "SIM108", "SIM114", "SIM115", "SIM201",
    "RUF001", "RUF002", "RUF003", "RUF005", "RUF007", "RUF012", "RUF013",
    "RUF015", "RUF017", "RUF022", "RUF034", "RUF046", "RUF059",
    "E501",
]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
