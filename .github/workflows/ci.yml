name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/eigencapital/ scripts/

      - name: Type check critical packages with mypy
        run: |
          # EC-AUD-010: Gate mypy on critical safety packages (fail on errors)
          mypy src/eigencapital/live/ src/eigencapital/reconciliation/ src/eigencapital/production_qual/ \
            --ignore-missing-imports --no-error-summary
          # Full codebase check (informational only, does not fail CI)
          mypy src/eigencapital/ --ignore-missing-imports || true

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=eigencapital \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
