name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Python 3.14 is supported locally (test suite green on 3.14.8) and
        # is included in CI explicitly; the matrix is the supported set.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      # SHA-pinned: actions/checkout@v4 (11d5960a3267)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Repo hygiene — no tracked files may be gitignored
        run: |
          offenders="$(git ls-files -i -c --exclude-standard)"
          if [ -n "$offenders" ]; then
            echo "::error::Tracked files match .gitignore — untrack them (git rm --cached) or fix the rule:"
            echo "$offenders"
            exit 1
          fi

      # SHA-pinned: actions/setup-python@v5 (a26af69be951)
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[research]"
          pip install -e ".[dev]"

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit

      - name: Lint with ruff
        run: ruff check src/eigencapital/ scripts/

      - name: Type check critical packages with mypy
        run: |
          # EC-AUD-010: Gate mypy on critical safety packages (fail on errors)
          mypy src/eigencapital/live/ src/eigencapital/reconciliation/ src/eigencapital/production_qual/ \
            --ignore-missing-imports --no-error-summary
          # Full codebase check (M-6: no longer masked — type errors fail the job)
          mypy src/eigencapital/ --ignore-missing-imports

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=eigencapital \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      # Suites outside tests/unit/ (all verified green in-tree, no live
      # services or credentials required). M-7: run on the FULL matrix —
      # integration coverage must not disappear on other Python versions.
      - name: Run property / integration / dashboard suites
        run: |
          pytest tests/property tests/integration tests/failure_injection \
            tests/simulation src/eigencapital/dashboard/tests -q

      # SHA-pinned: codecov/codecov-action@v5 (04b047e8bb82)
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned: actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # SHA-pinned: actions/setup-node@v4 (49933ea5288c)
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint (oxlint)
        working-directory: dashboard
        run: npm run lint

      # `npm run build` = `tsc -b && vite build` (typecheck + bundle)
      - name: Typecheck and build
        working-directory: dashboard
        run: npm run build
